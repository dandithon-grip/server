[project]
name = "saetgil-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "shapely>=2.2.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "ASYNC", "SIM"]
# N818: 비즈니스 예외 이름은 CLAUDE.md 가 정한 AppException 을 쓴다
ignore = ["N818"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입 관용구 `param: T = Depends(...)` 를 B008(기본값에 함수 호출)에서 제외한다
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]
# 프로젝트 안에 alembic/ 폴더가 있어 ruff 가 alembic 패키지를 1st-party 로 오인한다
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: 실제 OSM 데이터가 필요한 테스트"]
