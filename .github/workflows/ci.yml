name: CI

# PR 과 develop 푸시에서 돈다. 보호 규칙은 걸지 않고 결과만 PR 화면에 띄운다 (#17)
on:
  pull_request:
  push:
    branches: [develop]

# 이 워크플로는 저장소를 읽기만 한다. GITHUB_TOKEN 을 최소 권한으로 내린다
permissions:
  contents: read

jobs:
  test:
    name: 린트 · 타입 · 테스트
    runs-on: ubuntu-latest

    services:
      # 로컬 docker-compose.yml 과 같은 이미지. 공간 질의가 핵심이라 postgis 가 필요하다
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: saetgil
          POSTGRES_PASSWORD: saetgil
          POSTGRES_DB: saetgil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saetgil -d saetgil"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # 실제 키는 넣지 않는다. JWKS 조회는 conftest 가 테스트용 키 쌍으로 바꿔치기한다
      DATABASE_URL: postgresql+asyncpg://saetgil:saetgil@localhost:5432/saetgil
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_JWT_AUDIENCE: authenticated
      DEFAULT_CITY: daegu
      APP_ENV: test

    steps:
      - uses: actions/checkout@v7

      - name: uv 설치
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --locked

      # 서비스 컨테이너에는 docker/initdb 를 못 걸어서 여기서 만든다.
      # postgis 확장은 alembic 0001 이 CREATE EXTENSION 으로 넣는다
      - name: 테스트 DB 생성
        run: psql -h localhost -U saetgil -d saetgil -c 'CREATE DATABASE saetgil_test'
        env:
          PGPASSWORD: saetgil

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app scripts

      - name: pytest
        run: uv run pytest
