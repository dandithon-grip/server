[alembic]
script_location = %(here)s/alembic
# 파일명을 날짜_리비전_슬러그 로 만들어 정렬이 생성 순서와 같게 한다
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# sqlalchemy.url 은 여기 쓰지 않는다. alembic/env.py 가 Settings(.env) 에서 읽는다

[post_write_hooks]
# alembic revision 으로 만든 파일을 ruff 로 포맷한다
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
